<!DOCTYPE html>
<html>
<head>
    <title>Notas - Review Runbook</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f4f9; }
        .pane { flex: 1; display: flex; flex-direction: column; padding: 20px; border: 1px solid #ddd; }
        .pane-title { font-weight: bold; margin-bottom: 10px; color: #666; text-transform: uppercase; font-size: 0.8em; }
        textarea { flex: 1; font-family: monospace; padding: 15px; border: 1px solid #ccc; border-radius: 4px; resize: none; }
        pre { flex: 1; overflow: auto; background: #eee; padding: 15px; border-radius: 4px; font-size: 0.9em; }
        .footer { padding: 20px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: flex-end; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button.secondary { background: #6c757d; }
    </style>
</head>
<body>
    <div class="pane">
        <div class="pane-title">Raw Session Output</div>
        <pre>{{ raw_logs }}</pre>
    </div>
    <div class="pane">
        <div class="pane-title">AI Draft (Edit here)</div>
        <form id="save-form" action="/save" method="post">
            <input type="hidden" name="session_id" value="{{ session_id }}">
            <textarea name="content">{{ draft }}</textarea>
            <div class="footer">
                <a href="/" class="button secondary">Back</a>
                <button type="submit">Save Runbook (.md)</button>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('save-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/save', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.status === 'success') alert('Saved to: ' + data.path);
        };
    </script>
</body>
</html>
